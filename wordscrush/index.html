      /* ========== MAP + VIDEO COMBO (video_part.png) ========== */
      .map-video-wrap {

        width: min(92%, 860px);
        line-height: 0;
        margin: -14px auto 0;
        z-index: 1;
        overflow: hidden;
      }
      .map-depth-layer {
        --map-parallax-y: 0px;
        position: relative;
        transform: translate3d(0, var(--map-parallax-y), 0);
        will-change: transform;
      }
      .map-depth-layer > picture {
        display: block;
        line-height: 0;

      .map-depth-layer > picture > img {
        width: 100%;

      /*
        video_part.png is 980x1558.
        White box: x=62..917 (6.3%..93.6%), y=560..1517 (35.9%..97.4%)
        Box is 855x957. For 16:9 video (855x481), center vertically.
        Vertical center offset: (957-481)/2 = 238px = 15.3% of 1558
        So video top = 35.9% + 15.3% = 51.2%, height = 481/1558 = 30.9%
      */
      .video-in-map {
        position: absolute;
        top: 66.8%;
        left: 7.1%;
        width: 85.6%;
        height: 30.2%;
        border-radius: 6px;
        overflow: hidden;
        background: #000;
      }
      .video-in-map iframe {
        width: 100%; height: 100%;
        border: none;
        position: absolute;
        top: 0; left: 0;
      }
      .video-thumb-wrap {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;

        z-index: 2;

        border-width: 12px 0 12px 20px;

      .ss-card {

      /* ========== ENTRANCE ANIMATIONS ========== */

      /* 1. Tag flag-opening: appears AFTER logo (delay 1.6s) */
      @keyframes flagOpen {
        0%   { transform: scaleX(0); opacity: 0; }
        40%  { opacity: 1; }
        100% { transform: scaleX(1); opacity: 1; }
      }
      .zytoona-tag {
        transform-origin: left center;
        transform: scaleX(0);
        opacity: 0;
        animation: flagOpen 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 1.6s forwards;
      }

      /* 2. Logo: portable renderer — 917×705 stage scaled to fit */
      .logo-mount {
        display: flex;
        justify-content: center;
        margin: 0 auto 18px;
      }
      /* Entrance animations are handled by JS (staggered opacity fade).
         The renderer sets inline transform (matrix) — we never touch transform in CSS. */
      @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }

      /* 3. Tagline text appear — after all letters + tag */
      @keyframes fadeUp {
        0%   { transform: translateY(16px); opacity: 0; }
        100% { transform: translateY(0); opacity: 1; }
      }
      .hero-tagline {
        opacity: 0;
        animation: fadeUp 0.6s ease-out 1.9s forwards;
      }

      /* 4. Scroll-triggered reveals */
      .reveal {
        opacity: 0;
        transform: translateY(40px);
        transition: opacity 0.7s ease-out, transform 0.7s ease-out;
      }
      .reveal.visible {
        opacity: 1;
        transform: translateY(0);
      }
      .reveal-scale {
        opacity: 0;
        transform: scale(0.85);
        transition: opacity 0.6s ease-out, transform 0.6s ease-out;
      }
      .reveal-scale.visible {
        opacity: 1;
        transform: scale(1);

  <script src="/js/logo-layout.js"></script>
  <script src="/js/portable-logo-renderer.js"></script>
  <script src="/js/wordscrush-analytics.js?v=1"></script>
  <script>
    // 1. Create the logo using the portable renderer — exact 917×705 stage, scaled to fit
    (function() {
      var mount = document.getElementById('logoMount');
      if (!mount) return;

      var logo = window.WordsCrushPortableLogo.create(mount, {
        basePath: '/images/wordscrush',
        scale: 1,
        referenceVisible: false
      });

      // Fit to container width on load + resize — 70% of hero width, max 320px
      function fitLogo() {
        var heroW = mount.parentElement.offsetWidth;
        var target = Math.min(heroW * 0.7, 320);
        logo.fitToWidth(target);
      }
      fitLogo();
      window.addEventListener('resize', fitLogo);

      // 2. Entrance animations
      //    - WORDS tiles: drop from top (translate Y offset → 0)
      //    - CRUSH tiles: slide from right (translate X offset → 0)
      //    - Shadows: simple opacity fade, delayed until tiles have settled
      //    Uses CSS `translate` property (independent of `transform` which holds the matrix)
      var pieces = mount.querySelectorAll('.wc-logo-piece');
      var anims = {
        // WORDS tiles — drop from top, staggered left to right
        'words-w': { delay: 300, type: 'drop' },
        'words-o': { delay: 400, type: 'drop' },
        'words-r': { delay: 500, type: 'drop' },
        'words-d': { delay: 600, type: 'drop' },
        'words-s': { delay: 700, type: 'drop' },
        // CRUSH tiles — slide from right, staggered
        'crush-c': { delay: 850,  type: 'slide' },
        'crush-r': { delay: 950,  type: 'slide' },
        'crush-u': { delay: 1050, type: 'slide' },
        'crush-s': { delay: 1150, type: 'slide' },
        'crush-h': { delay: 1250, type: 'slide' },
        // Shadows — fade in AFTER tiles settle (tiles done ~1.25s + 0.5s anim = ~1.75s)
        'shadow-top-hard':    { delay: 1500, type: 'shadow' },
        'shadow-top-soft':    { delay: 1500, type: 'shadow' },
        'shadow-bottom-hard': { delay: 1700, type: 'shadow' },
        'shadow-bottom-soft': { delay: 1700, type: 'shadow' }
      };

      pieces.forEach(function(piece) {
        var id = piece.dataset.layerId;
        var cfg = anims[id];
        if (!cfg) return;

        var finalOpacity = piece.style.opacity || '1';
        piece.style.opacity = '0';

        if (cfg.type === 'drop') {
          // Start 80px above (in the 917×705 stage space)
          piece.style.translate = '0 -80px';
          piece.style.transition = 'none';
          setTimeout(function() {
            piece.style.transition = 'opacity 0.5s cubic-bezier(0.22,1,0.36,1), translate 0.5s cubic-bezier(0.22,1,0.36,1)';
            piece.style.opacity = finalOpacity;
            piece.style.translate = '0 0';
          }, cfg.delay);
        } else if (cfg.type === 'slide') {
          // Start 120px to the right
          piece.style.translate = '120px 0';
          piece.style.transition = 'none';
          setTimeout(function() {
            piece.style.transition = 'opacity 0.5s cubic-bezier(0.22,1,0.36,1), translate 0.5s cubic-bezier(0.22,1,0.36,1)';
            piece.style.opacity = finalOpacity;
            piece.style.translate = '0 0';
          }, cfg.delay);
        } else if (cfg.type === 'shadow') {
          // Simple fade: transparent → final alpha, after tiles done
          piece.style.transition = 'none';
          setTimeout(function() {
            piece.style.transition = 'opacity 0.6s ease-out';
            piece.style.opacity = finalOpacity;
          }, cfg.delay);
        }
      });

    })();

    // Two-layer depth: the map/video assembly drifts gently over the blue tile world.
    (function() {
      var mapLayer = document.querySelector('[data-parallax-map]');
      var movingLayer = document.querySelector('[data-parallax-layer]');
      if (!mapLayer || !movingLayer || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      var scheduled = false;
      function updateMapParallax() {
        scheduled = false;
        var rect = mapLayer.getBoundingClientRect();
        var viewportCenter = window.innerHeight / 2;
        var layerCenter = rect.top + rect.height / 2;
        var progress = (viewportCenter - layerCenter) / (window.innerHeight + rect.height);
        var strength = window.innerWidth < 600 ? 30 : 54;
        var offset = Math.max(-strength, Math.min(strength, progress * strength * 2));
        movingLayer.style.setProperty('--map-parallax-y', offset.toFixed(2) + 'px');
      }

      function requestMapParallax() {
        if (scheduled) return;
        scheduled = true;
        window.requestAnimationFrame(updateMapParallax);
      }

      requestMapParallax();
      window.addEventListener('scroll', requestMapParallax, { passive: true });
      window.addEventListener('resize', requestMapParallax);
    })();

    // Video click → YouTube embed
    document.getElementById('videoThumb')?.addEventListener('click', function() {
      var container = document.getElementById('videoEmbed');
      this.remove();
      var iframe = document.createElement('iframe');
      iframe.src = 'https://www.youtube-nocookie.com/embed/RI_1UyS3StE?autoplay=1&rel=0';
      iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
      iframe.allowFullscreen = true;
      container.appendChild(iframe);
    });

    // Apple-style scroll: scale cards based on distance from center
    (function() {
      var scroll = document.querySelector('.ss-scroll');
      if (!scroll) return;
      var cards = scroll.querySelectorAll('.ss-card');

      function updateCards() {
        var scrollCenter = scroll.scrollLeft + scroll.offsetWidth / 2;
        cards.forEach(function(card) {
          var cardCenter = card.offsetLeft + card.offsetWidth / 2;
          var dist = Math.abs(scrollCenter - cardCenter);
          var halfCard = card.offsetWidth * 0.6;
          var maxNear = scroll.offsetWidth * 0.4;
          card.classList.remove('active', 'near');
          if (dist < halfCard) {
            card.classList.add('active');
          } else if (dist < maxNear) {
            card.classList.add('near');
          }
        });
      }

      cards.forEach(function(card) {
        card.addEventListener('click', function() {
          var cardCenter = card.offsetLeft + card.offsetWidth / 2;
          var scrollTarget = cardCenter - scroll.offsetWidth / 2;
          scroll.scrollTo({ left: scrollTarget, behavior: 'smooth' });
        });
      });

      scroll.addEventListener('scroll', updateCards, { passive: true });
      setTimeout(updateCards, 100);
      window.addEventListener('resize', updateCards);
    })();

    // Scroll-triggered reveal animations
    (function() {
      var reveals = document.querySelectorAll('.reveal, .reveal-left, .reveal-scale');
      if (!reveals.length) return;

      var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
          }
        });
      }, {
        threshold: 0.15,
        rootMargin: '0px 0px -40px 0px'
      });

      reveals.forEach(function(el) {
        observer.observe(el);
      });
    })();
  </script>
</body>
</html>
